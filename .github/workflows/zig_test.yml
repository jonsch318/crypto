on:
    workflow_dispatch:
    pull_request:
      branches: [ "master", "dev" ]
  
jobs:
    test:
      runs-on: ubuntu-latest
      name: Build and Test
      steps:
        - uses: actions/checkout@v3
        - uses: mlugg/setup-zig@v1
          with:
            version: master
        - run: zig build test
  